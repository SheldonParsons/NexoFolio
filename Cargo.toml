[workspace]
members = ["apps/backend", "crates/common", "crates/contracts", "modules/access/contracts", "modules/access/core", "modules/access/adapter", "modules/curate/contracts", "modules/curate/core", "modules/curate/adapter", "modules/intake/contracts", "modules/intake/core", "modules/intake/adapter", "modules/knowledge/contracts", "modules/knowledge/core", "modules/knowledge/adapter", "modules/observe/contracts", "modules/observe/core", "modules/observe/adapter"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
version = "0.1.0"
publish = false

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
axum = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
rmcp = { version = "3.3.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
schemars = { version = "1.2.2", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros", "uuid", "chrono"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
nexofolio-common = { path = "crates/common" }
nexofolio-contracts = { path = "crates/contracts" }
nexofolio-access-contracts = { path = "modules/access/contracts" }
nexofolio-access = { path = "modules/access/core" }
nexofolio-access-adapter = { path = "modules/access/adapter" }
nexofolio-curate-contracts = { path = "modules/curate/contracts" }
nexofolio-curate = { path = "modules/curate/core" }
nexofolio-curate-adapter = { path = "modules/curate/adapter" }
nexofolio-intake-contracts = { path = "modules/intake/contracts" }
nexofolio-intake = { path = "modules/intake/core" }
nexofolio-intake-adapter = { path = "modules/intake/adapter" }
nexofolio-knowledge-contracts = { path = "modules/knowledge/contracts" }
nexofolio-knowledge = { path = "modules/knowledge/core" }
nexofolio-knowledge-adapter = { path = "modules/knowledge/adapter" }
nexofolio-observe-contracts = { path = "modules/observe/contracts" }
nexofolio-observe = { path = "modules/observe/core" }
nexofolio-observe-adapter = { path = "modules/observe/adapter" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "debuginfo"
