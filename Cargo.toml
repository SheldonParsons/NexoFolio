[workspace]
members = ["apps/backend", "crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
version = "0.1.0"
publish = false

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8.9"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
rmcp = { version = "3.3.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
schemars = { version = "1.2.2", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros", "uuid", "chrono"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
nexofolio-contracts = { path = "crates/contracts" }
nexofolio-access = { path = "crates/access" }
nexofolio-knowledge = { path = "crates/knowledge" }
nexofolio-intake = { path = "crates/intake" }
nexofolio-triggers = { path = "crates/triggers" }
nexofolio-rebuild = { path = "crates/rebuild" }
nexofolio-application = { path = "crates/application" }
nexofolio-infrastructure = { path = "crates/infrastructure" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "debuginfo"
