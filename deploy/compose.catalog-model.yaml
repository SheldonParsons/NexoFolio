# Optional model configuration. Worker executes only explicitly requested maintenance runs.
# Use together with compose.yaml and the local .env.catalog-model file.
services:
  api:
    user: "${NEXOFOLIO_CATALOG_MODEL_UID:-10001}:${NEXOFOLIO_CATALOG_MODEL_GID:-10001}"
    environment: &maintenance_model
      NEXOFOLIO_CATALOG_MODEL_BASE_URL: ${NEXOFOLIO_CATALOG_MODEL_BASE_URL:?Set catalog model base URL}
      NEXOFOLIO_CATALOG_MODEL: ${NEXOFOLIO_CATALOG_MODEL:?Set catalog model name}
      NEXOFOLIO_CATALOG_MODEL_API_KEY_FILE: /run/secrets/catalog-model-key
  worker:
    user: "${NEXOFOLIO_CATALOG_MODEL_UID:-10001}:${NEXOFOLIO_CATALOG_MODEL_GID:-10001}"
    environment: *maintenance_model
    volumes:
      - "${NEXOFOLIO_CATALOG_MODEL_KEY_HOST_FILE:?Set private model key file path}:/run/secrets/catalog-model-key:ro"
