[package]
name = "nexofolio-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "nexofolio-api"
path = "src/bin/api.rs"

[[bin]]
name = "nexofolio-admin"
path = "src/bin/admin.rs"

[[test]]
