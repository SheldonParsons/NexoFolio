nexofolio-audit-adapter.workspace = true
nexofolio-common.workspace = true
nexofolio-access-contracts.workspace = true
nexofolio-access.workspace = true
nexofolio-access-adapter.workspace = true
nexofolio-contracts.workspace = true
nexofolio-curate-contracts.workspace = true
