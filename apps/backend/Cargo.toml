[package]
name = "nexofolio-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "nexofolio-api"
path = "src/bin/api.rs"

[[bin]]
name = "nexofolio-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "nexofolio-admin"
path = "src/bin/admin.rs"

[[test]]
name = "architecture"
path = "../../tests/architecture/dependencies.rs"

[[test]]
name = "http_mcp"
path = "../../tests/integration/http_mcp.rs"

[[test]]
name = "postgres"
path = "../../tests/integration/postgres.rs"

[[test]]
name = "lifecycle"
path = "../../tests/integration/lifecycle.rs"

[[test]]
name = "access_flow"
path = "../../tests/integration/access_flow.rs"

[[test]]
name = "ingestion"
path = "../../tests/integration/ingestion.rs"

[[test]]
name = "processing"
path = "../../tests/integration/processing.rs"

[[test]]
name = "catalog_preview"
path = "../../tests/integration/catalog_preview.rs"

[[test]]
name = "replay"
path = "../../tests/integration/replay.rs"

[[test]]
name = "capture_evidence"
path = "../../tests/integration/capture_evidence.rs"

[dependencies]
nexofolio-contracts.workspace = true
nexofolio-access.workspace = true
nexofolio-intake.workspace = true
nexofolio-knowledge.workspace = true
jsonschema = { version = "0.33", default-features = false }
nexofolio-application.workspace = true
nexofolio-infrastructure.workspace = true
axum.workspace = true
clap.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
semver = "1"
serde-saphyr = { version = "1.2", default-features = false, features = ["deserialize"] }
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
nexofolio-evidence.workspace = true
nexofolio-rebuild.workspace = true
sqlx.workspace = true
argon2 = "0.5"
async-trait.workspace = true
http-body-util.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[lints]
workspace = true
