[package]
name = "nexofolio-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "nexofolio-api"
path = "src/bin/api.rs"

[[bin]]
name = "nexofolio-admin"
path = "src/bin/admin.rs"

[[test]]
name = "architecture"
path = "../../tests/architecture/dependencies.rs"

[[test]]
name = "http_mcp"
path = "../../tests/integration/http_mcp.rs"

[[test]]
name = "postgres"
path = "../../tests/integration/postgres.rs"

[[test]]
name = "lifecycle"
path = "../../tests/integration/lifecycle.rs"

[[test]]
name = "access_flow"
path = "../../tests/integration/access_flow.rs"

[[test]]
name = "contracts"
path = "../../tests/contracts/collect.rs"

[dependencies]
nexofolio-common.workspace = true
nexofolio-access-contracts.workspace = true
nexofolio-access.workspace = true
nexofolio-access-adapter.workspace = true
nexofolio-contracts.workspace = true
nexofolio-intake-contracts.workspace = true
nexofolio-intake.workspace = true
nexofolio-intake-adapter.workspace = true
nexofolio-knowledge-contracts.workspace = true
nexofolio-knowledge.workspace = true
nexofolio-knowledge-adapter.workspace = true
nexofolio-observe-contracts.workspace = true
nexofolio-observe.workspace = true
nexofolio-observe-adapter.workspace = true
async-trait.workspace = true
chrono.workspace = true
axum.workspace = true
clap.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
semver = "1"
serde-saphyr = { version = "1.2", default-features = false, features = ["deserialize"] }
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
nexofolio-intake-contracts = { workspace = true, features = ["testing"] }
nexofolio-observe-contracts = { workspace = true, features = ["testing"] }
sqlx.workspace = true
argon2 = "0.5"
http-body-util.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json"] }
jsonschema = { version = "0.57", default-features = false }
sha2 = "0.11"

[lints]
workspace = true
