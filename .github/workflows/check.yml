name: Foundation checks
on: [push, pull_request]

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: nexofolio
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: nexofolio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexofolio -d nexofolio"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p nexofolio-backend --test postgres --test access_flow --locked -- --ignored
        env:
          TEST_DATABASE_URL: postgres://nexofolio:isolated-ci-only@127.0.0.1:5432/nexofolio
      - run: docker build -f deploy/Dockerfile -t nexofolio-backend:foundation .
      - run: python3 tests/integration/compose_smoke.py
